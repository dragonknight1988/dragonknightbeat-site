server {
    server_name dragonknightbeat.com www.dragonknightbeat.com;
    root /var/www/dragonknightbeat.com;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 游戏平台 DragonGames
    location /games/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 缓存静态资源
    location ~* \.(json|jpg|jpeg|png|gif|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dragonknightbeat.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dragonknightbeat.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP → HTTPS 跳转（域名访问）
server {
    listen 80;
    server_name dragonknightbeat.com www.dragonknightbeat.com;
    return 301 https://$host$request_uri;
}

# IP 直连 HTTP（iOS App 用 http://8.130.185.192/games/）
server {
    listen 80;
    server_name 8.130.185.192;

    location /games/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        return 301 https://dragonknightbeat.com$request_uri;
    }
}
